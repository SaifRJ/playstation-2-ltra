<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayStation 2 LTRA</title>
    <link rel="stylesheet" href="style/main.css">
</head>
<body>
<script type="module" src="js/main.js"></script>
<div id="fade-overlay"></div>
<div class="vignette"></div>

    <!-- 'Press PS Button' Screen -->
    <div id="screen-press-ps" class="screen active">
        <div class="press-ps-content">
            <p>Press PS Button</p>
        </div>
    </div>

    <!-- 'Who's Playing?' Screen -->
    <div id="screen-account-select" class="screen">
        <div class="select-account-content ">
            <p class="welcome-select-account">Welcome to PlayStation 2</p>
            <p class="select-account-title">Who's playing?</p>
            <p class="account-name-display"></p>
        </div>
    </div>

    <!-- Main Menu Screen -->
    <div id="screen-main-menu" class="screen">
        <div class="main-menu-content ">
            <div class="clock-display"></div>
            <p class="menu-item-name-display"></p>
            <img src="assets\images\menuarrow.svg" class="menu-arrow">
        </div>
    </div>

</body>
</html>
